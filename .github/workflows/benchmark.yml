name: Benchmark

# Runs the agent eval question set against a local copy of the Worker (the AI binding is the only remote part) and
# opens a pull request that adds one record to evals/history/. See evals/README.md, "Benchmark history".
#
# Manual only: a live run spends model money and uses the eval token. Add a trigger (for example after a deploy, or
# weekly) only once a baseline exists and the eval gateway's spend limit is confirmed.
#
# Before the first run, in the repository settings:
#   - create the environment `cloudflare-evals`, restrict it to the `main` branch, and add the secret
#     CLOUDFLARE_API_TOKEN (Account -> Workers Scripts -> Edit, this account only; see evals/README.md "The eval token")
#   - set the repository variable CLOUDFLARE_ACCOUNT_ID (already used by the deploy workflow)
#   - allow GitHub Actions to create pull requests (Settings -> Actions -> General)

on:
  workflow_dispatch:
    inputs:
      model:
        description: Model under test. Empty means the production model (AGENT_MODEL in wrangler.jsonc).
        required: false
        type: string

permissions:
  contents: read

# One writer at a time: two runs would each claim the next sequence number.
concurrency:
  group: benchmark-history
  cancel-in-progress: false

jobs:
  benchmark:
    # The environment's branch rule is the real gate; this keeps a dispatch from another ref from running at all.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-evals
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A pull request that adds the next record and is not merged yet would collide with this run's record: both
      # would be sequence N. Merge or close it first.
      - name: Refuse while a benchmark record is waiting to merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --label benchmark-record --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "::error::A benchmark pull request is still open. Merge or close it, then run this again."
            exit 1
          fi

      - name: Check the history chain is intact
        run: npm run evals:history -- verify

      - name: Build
        run: npm run build

      - name: Pick the model
        id: model
        env:
          INPUT_MODEL: ${{ inputs.model }}
        run: |
          model="$INPUT_MODEL"
          if [ -z "$model" ]; then
            model=$(node -e "import('jsonc-parser').then(({ parse }) => console.log(parse(require('fs').readFileSync('wrangler.jsonc', 'utf8')).vars.AGENT_MODEL))")
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"

      # The token is passed to this step only. The agent runs on the runner (loopback), so the visitor Guard and
      # Durable Objects are never touched; evals:serve routes model calls through the separate eval gateway.
      - name: Serve the agent locally and run the evals
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EVAL_MODEL: ${{ steps.model.outputs.model }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npm run evals:serve > serve.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/ || true)
            [ "$code" != "000" ] && break
            sleep 2
          done
          if [ "$code" = "000" ]; then
            echo "::error::The local agent did not start."
            tail -n 40 serve.log | sed -E 's/(token|secret)[^ ]*/[redacted]/Ig'
            exit 1
          fi
          npm run evals -- --base-url http://127.0.0.1:8787

      # The scorecard holds the full answers, so it stays an artifact for a short time and is not committed.
      - name: Keep the scorecard
        uses: actions/upload-artifact@v7
        with:
          name: scorecard
          path: evals/results
          retention-days: 30

      - name: Open a pull request with the record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The newest scorecard by modification time; names are controlled (date and model slug).
          # shellcheck disable=SC2012
          scorecard=$(ls -t evals/results/*/*.json | head -n 1)
          npm run evals:history -- export --scorecard "$scorecard"
          npm run evals:history -- verify --base origin/main
          summary=$(npm run --silent evals:history -- list | tail -n 1)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="benchmark/run-${GITHUB_RUN_ID}"
          git checkout -b "$branch"
          git add evals/history
          git commit -m "Benchmark record (run ${GITHUB_RUN_ID})"
          git push origin "$branch"

          gh label create benchmark-record --color 0e8a16 --description "A benchmark history record" 2>/dev/null || true
          gh pr create --base main --head "$branch" --label benchmark-record \
            --title "Benchmark record (run ${GITHUB_RUN_ID})" \
            --body "Adds one record to evals/history/ from [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}).

          \`${summary}\`

          The hash chain and append-only check passed before this was pushed. Pull requests opened with the workflow token do not start the usual checks, so \`Site quality\` will not run on this one; the record is data only. Compare it with the last with \`npm run evals:history -- compare <a> <b>\`. The full scorecard is the run's \`scorecard\` artifact (30 days). Merge or close it before the next run."
