name: Site quality

on:
  pull_request:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Node comes from mise.toml and mise.lock (exact version, checksummed), the same pin used locally.
      - name: Setup Node
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      # Benchmark history is append-only: a pull request may add records, never change or remove one. The ref goes
      # through env, not into the script, so a branch name cannot inject shell.
      - name: Check the benchmark history is append-only
        env:
          BASE_REF: ${{ github.base_ref }}
        run: npm run evals:history -- verify --base "origin/$BASE_REF"
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Validate design, types, build, and visual contract
        run: npm run quality
      - name: Validate public execution lab and download bundle
        run: |
          docker pull python:3.12-alpine
          python3 experiments/bounded-runner/test_lab.py
          python3 scripts/package-lab.py
          git diff --exit-code -- public/downloads/bounded-runner.zip
