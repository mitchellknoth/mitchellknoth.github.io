name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node comes from mise.toml and mise.lock (exact version, checksummed), the same pin used locally.
      - name: Setup Node
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node
          # This job publishes or holds a credential: never restore a cache written by another run (the action's
          # advice for release jobs). The lockfile still verifies every download.
          cache: false
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate design, types, build, and visual contract
        run: npm run quality

      # The validated build, for the Workers deploy below.
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          retention-days: 7

  # Deploys the validated build to Cloudflare Workers static assets, which serve mitchellknoth.com
  # (docs/runbooks/workers-cutover.md). Skipped unless the repository variable CF_WORKERS_DEPLOY is "true".
  deploy-workers:
    needs: build
    if: vars.CF_WORKERS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare-workers
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node comes from mise.toml and mise.lock (exact version, checksummed), the same pin used locally.
      - name: Setup Node
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: node
          # This job publishes or holds a credential: never restore a cache written by another run (the action's
          # advice for release jobs). The lockfile still verifies every download.
          cache: false
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Download validated site
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Deploy to Cloudflare Workers
        run: npm run deploy:workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
