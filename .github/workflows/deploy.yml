name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Validate design, types, build, and visual contract
        run: npm run quality

      # The validated build, for the Workers deploy below.
      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: dist
          retention-days: 7

  # Deploys the validated build to Cloudflare Workers static assets, which serve mitchellknoth.com
  # (docs/runbooks/workers-cutover.md). Skipped unless the repository variable CF_WORKERS_DEPLOY is "true".
  deploy-workers:
    needs: build
    if: vars.CF_WORKERS_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment:
      name: cloudflare-workers
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download validated site
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: dist

      - name: Deploy to Cloudflare Workers
        run: npm run deploy:workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
